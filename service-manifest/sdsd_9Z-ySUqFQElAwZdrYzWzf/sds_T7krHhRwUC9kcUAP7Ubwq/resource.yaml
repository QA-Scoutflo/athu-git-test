apiVersion: v1
kind: Service
metadata:
  name: edit-qa-2
  namespace: nodejs-app
  labels:
    app: edit-qa-2
spec:
  type: ClusterIP
  selector:
    app: edit-qa-2
  ports:
    - name: https
      protocol: TCP
      port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edit-qa-2
  namespace: nodejs-app
  labels:
    app: edit-qa-2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edit-qa-2
  template:
    metadata:
      labels:
        app: edit-qa-2
    spec:
      containers:
        - name: edit-qa-2-container
          image: satyamp07/waitlist:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 200m
          env:
            - name: NEXT_PUBLIC_ATLAS_BACKEND
              value: https://api.atlas.scoutflo.com/api
      imagePullSecrets:
        - name: scoutflo-satyam-docker-docker

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edit-qa-2
  namespace: nodejs-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: edit-qa-2-sdst7krhhrwuc9kcuap7ubwq-uhhv8.scoutflo.agency
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edit-qa-2
                port:
                  number: 3000
  tls:
    - hosts:
        - edit-qa-2-sdst7krhhrwuc9kcuap7ubwq-uhhv8.scoutflo.agency
      secretName: scoutflo-agency-wildcard-tls
